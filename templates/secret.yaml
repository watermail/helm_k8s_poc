apiVersion: v1
kind: Secret
stringData:
  DATABASE_HOST: {{ .Values.database.host }}
  DATABASE_NAME: {{ .Values.database.name }}
  DATABASE_PASSWORD: {{ .Values.database.password }}
  DATABASE_USER: {{ .Values.database.host }}
  REDIS_URL: {{ .Values.redisUrl }} 
  secret_key_base: 
metadata:
  name: {{ include "worker.fullname" . }}-secret
type: Opaque
data:
  RAILS_ENV: {{ .Values.env.RAILS_ENV | b64enc }}
